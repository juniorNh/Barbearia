<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utilizadores | Djuzzy Barber</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="../css/estilo.css?v=7">
  <script src="../js/api.js?v=7" defer></script>
  <script src="../js/interface.js?v=7" defer></script>
  <script src="../js/utilizadores.js?v=7" defer></script>
</head>
<body>
<header class="topo" id="topo"></header>
<main class="miolo">
  <div id="aviso"></div>
  <div id="conteudo">
    <h1>Utilizadores do pessoal</h1>
    <form id="form-utilizador" class="caixa">
      <h2>Novo utilizador</h2>
      <div class="linha2">
        <div><label for="nome">Nome completo</label><input id="nome" name="nome" maxlength="120" required></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" maxlength="120" required></div>
      </div>
      <div class="linha2">
        <div><label for="perfil">Perfil</label>
          <select id="perfil" name="perfil">
            <option value="funcionario">Funcionário</option>
            <option value="administrador">Administrador</option>
          </select></div>
        <div><label for="senha">Senha (mínimo 8 caracteres)</label><input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required></div>
      </div>
      <label for="senha2">Repetir a senha</label>
      <input id="senha2" name="senha2" type="password" minlength="8" autocomplete="new-password" required>
      <div class="acoes"><button type="submit">Criar utilizador</button></div>
    </form>
    <div class="caixa">
      <h2>Contas existentes</h2>
      <div class="tabela">
        <table>
          <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Estado</th><th>Registo</th><th></th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>
