<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços | Djuzzy Barber</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="../css/estilo.css?v=7">
  <script src="../js/api.js?v=7" defer></script>
  <script src="../js/interface.js?v=7" defer></script>
  <script src="../js/servicos.js?v=7" defer></script>
</head>
<body>
<header class="topo" id="topo"></header>
<main class="miolo">
  <div id="aviso"></div>
  <div id="conteudo">
    <h1>Serviços e preços</h1>
    <form id="form-servico" class="caixa">
      <h2 id="titulo-form">Novo serviço</h2>
      <div class="linha2">
        <div><label for="nome">Nome</label><input id="nome" name="nome" maxlength="80" required></div>
        <div><label for="preco">Preço (MT)</label><input id="preco" name="preco" inputmode="decimal" maxlength="11" required></div>
      </div>
      <div class="linha2">
        <div><label for="descricao">Descrição (opcional)</label><input id="descricao" name="descricao" maxlength="255"></div>
        <div><label for="duracao_minutos">Duração (minutos)</label><input id="duracao_minutos" name="duracao_minutos" type="number" min="5" max="240" step="5" value="30" required></div>
      </div>
      <div class="acoes">
        <button type="submit" id="guardar">Adicionar serviço</button>
        <button type="button" class="sec" id="cancelar" hidden>Cancelar edição</button>
      </div>
    </form>
    <div class="caixa">
      <h2>Serviços cadastrados</h2>
      <div class="tabela">
        <table>
          <thead><tr><th>Nome</th><th>Descrição</th><th>Preço</th><th>Duração</th><th>Estado</th><th></th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>
