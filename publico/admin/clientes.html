<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | Djuzzy Barber</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=UnifrakturCook:wght@700&display=swap">
  <link rel="stylesheet" href="../css/estilo.css?v=7">
  <script src="../js/api.js?v=7" defer></script>
  <script src="../js/interface.js?v=7" defer></script>
  <script src="../js/clientes.js?v=7" defer></script>
</head>
<body>
<header class="topo" id="topo"></header>
<main class="miolo">
  <div id="aviso"></div>
  <div id="conteudo">
    <h1>Clientes</h1>
    <form id="form-cliente" class="caixa">
      <h2 id="titulo-form">Novo cliente</h2>
      <div class="linha2">
        <div><label for="nome">Nome completo</label><input id="nome" name="nome" maxlength="120" required></div>
        <div><label for="contacto">Contacto (telefone)</label><input id="contacto" name="contacto" type="tel" maxlength="20" required></div>
      </div>
      <div class="acoes">
        <button type="submit" id="guardar">Registar cliente</button>
        <button type="button" class="sec" id="cancelar" hidden>Cancelar edição</button>
      </div>
    </form>
    <div class="caixa">
      <h2>Clientes registados</h2>
      <label for="busca">Pesquisar por nome ou contacto</label>
      <input id="busca" type="search" maxlength="60" autocomplete="off">
      <div class="tabela">
        <table>
          <thead><tr><th>ID</th><th>Nome completo</th><th>Contacto</th><th>Conta</th><th>Registo</th><th></th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <div class="paginacao">
        <span class="cinza" id="resumo"></span>
        <span>
          <button type="button" class="sec pequeno" id="anterior">Anterior</button>
          <button type="button" class="sec pequeno" id="seguinte">Seguinte</button>
        </span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
